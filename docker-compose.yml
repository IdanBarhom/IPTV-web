services:
  mongodb:
    image: mongo:6
    container_name: iptv-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=iptv

  backend:
    build: ./backend
    container_name: iptv-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      - DATABASE_URI=mongodb://mongodb:27017/iptv
      - JWT_SECRET=test-secret-key
      - PORT=5000
      - ARCJET_ENV=development
  
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    container_name: iptv-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:5000/api/v1

volumes:
  mongodb_data: